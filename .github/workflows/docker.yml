name: Docker

on:
  push:
    branches: [ main ]
    tags:
      - '*'
  pull_request:
    branches:
      - main

jobs:
  docker:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/doerfli/reeper/reeper
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha,prefix=

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/doerfli/reeper/reeper:${{ steps.meta.outputs.version }}
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          # Ruby's own bundled/default gem specs; app only loads gems from vendor/bundle
          # (see Dockerfile `bundle config set --local path vendor/bundle`). Update the
          # ruby version segment here if RUBY_VERSION's ABI version changes.
          skip-dirs: 'usr/local/lib/ruby/gems/4.0.0/specifications'
          trivyignores: .trivyignore.yaml

